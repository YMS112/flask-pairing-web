<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>정보 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      color: #343a40;
    }
    .form-container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2 class="mb-4">정보 수정 - {{ person.name }}</h2>
    <form method="POST">
      <div class="mb-3">
        <label for="gender" class="form-label">성별</label>
        <select class="form-select" name="gender" id="gender" required>
          <option value="male" {% if person.gender == 'male' %}selected{% endif %}>남자</option>
          <option value="female" {% if person.gender == 'female' %}selected{% endif %}>여자</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="age" class="form-label">나이</label>
        <select class="form-select" name="age" id="age" required>
          <option value="young" {% if person.age == 'young' %}selected{% endif %}>젊은 사람</option>
          <option value="old" {% if person.age == 'old' %}selected{% endif %}>나이든 사람</option>
        </select>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" name="car" id="car" {% if person.car %}checked{% endif %}>
        <label class="form-check-label" for="car">차량 있음</label>
      </div>
      <button type="submit" class="btn btn-primary">수정 완료</button>
      <a href="/" class="btn btn-secondary ms-2">← 돌아가기</a>
    </form>
  </div>
</body>
</html>
