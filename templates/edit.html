<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정보 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>정보 수정: {{ person.name }}</h2>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">성별</label>
        <select name="gender" class="form-select" required>
          <option value="male" {% if person.gender == 'male' %}selected{% endif %}>남자</option>
          <option value="female" {% if person.gender == 'female' %}selected{% endif %}>여자</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">나이</label>
        <select name="age" class="form-select" required>
          <option value="young" {% if person.age == 'young' %}selected{% endif %}>젊은</option>
          <option value="old" {% if person.age == 'old' %}selected{% endif %}>나이든</option>
        </select>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="car" id="car" {% if person.car %}checked{% endif %}>
        <label class="form-check-label" for="car">차량 소지</label>
      </div>
      <button type="submit" class="btn btn-primary">저장</button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">취소</a>
    </form>
  </div>
</body>
</html>
