<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>팀 구성 결과</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .team-box {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1>팀 구성 결과</h1>
    <div id="result-text">
      <h3>남자 팀</h3>
      {% for team in male_teams %}
        <div class="team-box">
          {% for person in team %}
            <p>{{ person.name }}</p>
          {% endfor %}
        </div>
      {% endfor %}

      <h3>여자 팀</h3>
      {% for team in female_teams %}
        <div class="team-box">
          {% for person in team %}
            <p>{{ person.name }}</p>
          {% endfor %}
        </div>
      {% endfor %}
    </div>

    <button class="btn btn-outline-primary" onclick="copyText()">팀 구성 결과 복사</button>
    <a href="{{ url_for('index') }}" class="btn btn-link">← 돌아가기</a>
  </div>

  <script>
    function copyText() {
      const text = Array.from(document.querySelectorAll('#result-text p'))
        .map(p => p.textContent).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        alert("팀 구성 결과가 복사되었습니다!");
      });
    }
  </script>
</body>
</html>
