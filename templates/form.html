<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사람 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
    }
    h1, h2 {
      color: #333;
    }
    .table thead {
      background-color: #e9f5ff;
    }
  </style>
</head>
<body class="container py-5">
  <h1 class="mb-4">사람 등록</h1>

  <form method="post" action="/add" class="mb-5">
    <div class="mb-3">
      <label class="form-label">이름</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">성별</label>
      <select name="gender" class="form-select">
        <option value="male">남자</option>
        <option value="female">여자</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">연령</label>
      <select name="age" class="form-select">
        <option value="young">젊은</option>
        <option value="old">나이든</option>
      </select>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="car" id="carCheck">
      <label class="form-check-label" for="carCheck">차량 보유</label>
    </div>
    <button type="submit" class="btn btn-primary">추가</button>
  </form>

  <h2 class="mb-3">등록된 사람 목록</h2>
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>이름</th>
        <th>성별</th>
        <th>연령</th>
        <th>차량</th>
        <th>수정</th>
        <th>삭제</th>
      </tr>
    </thead>
    <tbody>
      {% for person in people %}
      <tr>
        <td>{{ person.name }}</td>
        <td>{{ person.gender }}</td>
        <td>{{ person.age }}</td>
        <td>{{ "O" if person.car else "X" }}</td>
        <td><a href="{{ url_for('edit', id=person.id) }}" class="btn btn-sm btn-outline-secondary">수정</a></td>
        <td>
          <form method="post" action="{{ url_for('delete', id=person.id) }}" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="/pair" class="btn btn-success">팀 구성 결과 보기</a>
</body>
</html>
