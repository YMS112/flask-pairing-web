<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사람 추가하기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>사람 추가하기</h1>
    <form action="{{ url_for('add') }}" method="POST" class="mb-4">
      <div class="row g-2">
        <div class="col-md-3">
          <input type="text" name="name" placeholder="이름" class="form-control" required>
        </div>
        <div class="col-md-2">
          <select name="gender" class="form-select" required>
            <option value="">성별</option>
            <option value="male">남자</option>
            <option value="female">여자</option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="age" class="form-select" required>
            <option value="">나이</option>
            <option value="young">젊은</option>
            <option value="old">나이든</option>
          </select>
        </div>
        <div class="col-md-2">
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" name="car" id="car">
            <label class="form-check-label" for="car">차량 소지</label>
          </div>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-primary w-100">추가</button>
        </div>
      </div>
    </form>

    <h2 class="mt-5">등록된 사람 목록</h2>
    <table class="table table-striped table-bordered mt-3">
      <thead class="table-light">
        <tr>
          <th>이름</th>
          <th>성별</th>
          <th>연령대</th>
          <th>차량 보유</th>
          <th>수정</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody>
        {% for person in people %}
        <tr>
          <td>{{ person.name }}</td>
          <td>{{ '남자' if person.gender == 'male' else '여자' }}</td>
          <td>{{ '젊음' if person.age == 'young' else '나이듦' }}</td>
          <td>{{ 'O' if person.car else 'X' }}</td>
          <td>
            <a href="{{ url_for('edit', name=person.name) }}" class="btn btn-sm btn-secondary">수정</a>
          </td>
          <td>
            <form method="POST" action="{{ url_for('delete', name=person.name) }}">
              <button type="submit" class="btn btn-sm btn-danger">삭제</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>


    <a href="{{ url_for('pair') }}" class="btn btn-success mt-3">팀 구성 결과 보기</a>
  </div>
</body>
</html>
